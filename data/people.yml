# People shown in "About the group".
#
# members            -> the core group: name, university, optional role, and
#                        small grey profile links
# collaborator-groups -> one list per project, keyed by the project `id` in
#                        projects.yml. These render inside that project's card,
#                        behind its "Collaborators" expander. People may appear
#                        under several projects; that is expected.
#
# Everything is sorted by `order`, lowest first. Gaps in the numbers are fine.
# A profile link left empty is simply not shown.
#
# Affiliation sources: ORCID employment records, the STREAM protocol
# (J Clin Epidemiol 2026), the LIGHTS team page, and the ICEMAN development
# group as published in CMAJ 2020. Where somebody appears twice, their
# affiliation is repeated; keep the copies in step if one of them changes.


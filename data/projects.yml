# Projects shown on the homepage.
#
# status: current   -> "What we are working on": one expandable card each
#         planning  -> "What we are considering": all items in a single card
# order:            -> position within its own section, lowest first
# logo:             -> path under assets/; leave empty for a plain monogram tile
#
# Each current project carries a `links:` list of named groups. Groups render
# in `order`, items in the order written. Add a group, add an item, or drop
# either: the card counts them and lays them out by itself. A project with no
# links shows no disclosure control at all.
#
# Every URL below was opened and checked. Do not add one you have not.

projects:
  - id: type-me
    name: "TYPE-ME"
    order: 1
    status: current
    logo: "assets/projects/type-me.svg"
    logo-alt: "TYPE-ME logo: a magnifying glass containing smaller magnifying glasses"
    description: >-
      Methods research goes by dozens of different names, which makes it hard
      to find. TYPE-ME sorts it into clear types, so you can say what you did.
    links:
      - group: "Visit"
        order: 1
        items:
          - text: "Project website"
            url: "https://methods-research.org"
          - text: "Condensed typology"
            url: "https://methods-research.org/simplified.html"
          - text: "Interactive typology"
            url: "https://methods-research.org/explore.html"
      - group: "Publications"
        order: 2
        items:
          - text: "Preprint, MetaArXiv 2026"
            url: "https://osf.io/preprints/metaarxiv/nyj2p_v1"

  - id: stream
    name: "STREAM"
    order: 2
    status: current
    logo: ""
    logo-alt: ""
    description: >-
      People who write methods guidance get almost no guidance themselves.
      STREAM looks at how they work now, and builds standards for doing it
      well.
    links:
      - group: "Visit"
        order: 1
        items:
          # TODO: live once DNS for stream.methods-research.org exists.
          - text: "Project website"
            url: "https://stream.methods-research.org"
      - group: "Publications"
        order: 2
        items:
          - text: "Protocol, J Clin Epidemiol 2026"
            url: "https://doi.org/10.1016/j.jclinepi.2026.112184"
          - text: "Proposed and applied strategies, J Clin Epidemiol 2026"
            url: "https://doi.org/10.1016/j.jclinepi.2026.112483"
      - group: "Funding"
        order: 3
        items:
          - text: "SNSF Ambizione grant 223702"
            url: "https://data.snf.ch/grants/grant/223702"

  - id: lights
    name: "LIGHTS"
    order: 3
    status: current
    logo: "assets/projects/lights.png"
    logo-alt: "LIGHTS logo"
    description: >-
      Advice on research methods sits scattered across thousands of papers.
      LIGHTS gathers it into one library you can actually search.
    links:
      - group: "Visit"
        order: 1
        items:
          - text: "Project website"
            url: "https://lights.science"
          - text: "Search the library"
            url: "https://lights.science/app/search/"
          - text: "Search help"
            url: "https://lights.science/help/"
          - text: "Team and supporters"
            url: "https://lights.science/team-and-supporters/"
      - group: "Publications"
        order: 2
        items:
          - text: "JAMA Netw Open 2023"
            url: "https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2801408"
          - text: "Survey of 105 guidance articles, J Clin Epidemiol 2022"
            url: "https://doi.org/10.1016/j.jclinepi.2022.05.005"

  - id: iceman
    name: "ICEMAN"
    order: 4
    status: current
    logo: "assets/projects/iceman.svg"
    logo-alt: "ICEMAN logo"
    description: >-
      Trials and reviews often claim a treatment worked better in one group of
      patients than another. ICEMAN helps you work out whether to believe
      it.
    links:
      - group: "Visit"
        order: 1
        items:
          - text: "Project website"
            url: "https://www.iceman.help"
          - text: "ICEMAN online"
            url: "https://www.iceman.help/tool.html"
          - text: "User manual"
            url: "https://www.iceman.help/manual/"
      - group: "Publications"
        order: 2
        items:
          - text: "CMAJ 2020, primary reference"
            url: "https://doi.org/10.1503/cmaj.200077"
          - text: "J Clin Epidemiol 2019, background"
            url: "https://doi.org/10.1016/j.jclinepi.2019.05.014"
          - text: "JAMA Netw Open 2024, commentary"
            url: "https://doi.org/10.1001/jamanetworkopen.2024.3339"
      - group: "Used by"
        order: 3
        items:
          - text: "Cochrane Handbook, section 10.11.6"
            url: "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10#section-10-11-6"
          - text: "GRADE guidance 36, J Clin Epidemiol 2023"
            url: "https://doi.org/10.1016/j.jclinepi.2023.03.003"
          - text: "Core GRADE 3, BMJ 2025"
            url: "https://doi.org/10.1136/bmj-2024-081905"
          - text: "IQWiG General Methods 7.0 (PDF)"
            url: "https://www.iqwig.de/methoden/general-methods_version-7-0.pdf"
      - group: "Download"
        order: 4
        items:
          - text: "Form for trials (.docx)"
            url: "https://www.iceman.help/files/iceman-rct-form.docx"
          - text: "Form for meta-analyses (.docx)"
            url: "https://www.iceman.help/files/iceman-meta-analysis-form.docx"
          - text: "Reporting templates (.docx)"
            url: "https://www.iceman.help/files/iceman-table-templates.docx"
      - group: "In progress"
        order: 5
        items:
          - text: "OSF, how people have used ICEMAN"
            url: "https://osf.io/zv3jh/overview"

  - id: registry
    name: "A prospective registry for methods research"
    order: 1
    status: planning
    description: >-
      Almost nobody registers a methods study before starting it, so we cannot
      tell what is already underway or whether the plan changed on the way.
      We are asking what a registry would need to be worth using.

  - id: review-guidance
    name: "Guidance for reviews of applied methods and meta-epidemiology"
    order: 2
    status: planning
    description: >-
      Two of the commonest kinds of methods research still have no agreed way
      to run or report them. We are working out how to fix that.

  - id: methodological-evidence
    name: "What counts as methodological evidence"
    order: 3
    status: planning
    description: >-
      How do you show that one method beats another? We want to map the kinds
      of evidence people lean on, and say how much weight each one can bear.

  - id: ai-decisions
    name: "AI-mediated methodological decisions"
    order: 4
    status: planning
    description: >-
      More and more researchers ask an AI what design or analysis to use. We
      want to find out what these tools actually recommend, and what that
      means for the guidance we write.

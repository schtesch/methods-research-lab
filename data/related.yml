# Initiatives, networks and resources outside the Lab.
#
# These are NOT our projects. Keep each description short and make the
# relationship explicit, so the page never implies that we run them.
#
# Sorted by `order`, lowest first.

related:
  - name: "GRADE Working Group"
    order: 1
    url: "https://www.gradeworkinggroup.org"
    description: >-
      Sets the GRADE approach for rating how certain the evidence is. Some of
      us help write its guidance.

  - name: "EQUATOR Network"
    order: 2
    url: "https://www.equator-network.org"
    description: >-
      Keeps the library of reporting guidelines for health research. We use it,
      and we study it.

  - name: "COMET Initiative"
    order: 3
    url: "https://www.comet-initiative.org"
    description: >-
      Collects core outcome sets for trials and reviews. We do not run it, but
      we point people to it.


# Initiatives, networks and resources outside the Lab.
#
# The section introduction identifies these as independently led initiatives.
# Each description explains what the resource helps researchers do.
#
# Sorted by `order`, lowest first.

related:
  - name: "EQUATOR Network"
    order: 1
    url: "https://www.equator-network.org"
    description: >-
      Helps researchers report health studies clearly and completely, with
      a searchable library of reporting guidelines and practical resources.

  - name: "COMET Initiative"
    order: 2
    url: "https://www.comet-initiative.org"
    description: >-
      Helps researchers find and develop core outcome sets: the minimum
      outcomes that studies of a particular condition should measure and report.

  - name: "LATITUDES Network"
    order: 3
    url: "https://www.latitudes-network.org"
    description: >-
      Brings together tools and training to help researchers assess validity
      and risk of bias in evidence syntheses.

